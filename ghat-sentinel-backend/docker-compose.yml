services:
  backend:
    build: .
    image: ghat-sentinel-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      # Optional AI wording (leave empty for deterministic-only):
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      APP_ENV: ${APP_ENV:-development}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-}
      DEMO_USERS: ${DEMO_USERS:-true}
      PRESENTER_EMAIL: ${PRESENTER_EMAIL:-}
      PRESENTER_PASSWORD: ${PRESENTER_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_MODE: ${WHATSAPP_MODE:-template}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-en}
      WHATSAPP_TIMEOUT_SECONDS: ${WHATSAPP_TIMEOUT_SECONDS:-15}
      MESSAGING_DRY_RUN: ${MESSAGING_DRY_RUN:-false}
      MESSAGING_MAX_RECIPIENTS: ${MESSAGING_MAX_RECIPIENTS:-20}
      MESSAGING_MAX_PER_HOUR: ${MESSAGING_MAX_PER_HOUR:-60}
    volumes:
      - ghat-data:/data      # SQLite DB (cases, briefs) + downloaded CSVs survive restarts
    restart: unless-stopped

  # frontend:   # add the Next.js service here once the frontend project is available
  #   build: ../ghat-sentinel-frontend
  #   ports: ["3000:3000"]
  #   environment:
  #     NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
  #   depends_on:
  #     backend:
  #       condition: service_healthy

volumes:
  ghat-data:
