[project]
name = "ghat-sentinel-backend"
version = "1.0.0"
description = "Ghat Sentinel - environmental intelligence backend for Visarjan Ghat Watch (Bhopal)"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
