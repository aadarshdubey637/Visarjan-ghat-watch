services:
  - type: web
    name: ghat-sentinel-backend
    runtime: python
    plan: starter            # persistent disks require a paid plan
    buildCommand: pip install -r requirements.txt
    startCommand: (python scripts/download_data.py || echo "download failed; continuing"); (python scripts/seed_database.py || echo "seed failed; continuing"); uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    disk:
      name: ghat-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: AUTH_ENABLED
        value: "true"
      - key: DEMO_USERS
        value: "false"
      - key: JWT_SECRET
        generateValue: true     # secret; rotating it invalidates all tokens
      - key: BOOTSTRAP_OFFICER_EMAIL
        sync: false
      - key: BOOTSTRAP_OFFICER_PASSWORD
        sync: false
      - key: PRESENTER_EMAIL     # optional demo-role (presenter) account for a pitch deployment
        sync: false
      - key: PRESENTER_PASSWORD
        sync: false
      - key: DATABASE_URL
        value: sqlite:////var/data/ghat_sentinel.db
      - key: DATA_DIR
        value: /var/data
      - key: FRONTEND_ORIGIN
        value: https://your-frontend.example.com   # change me
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      # Messaging (docs/MESSAGING.md): secrets are entered in the Render dashboard
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: SMTP_TIMEOUT_SECONDS
        value: "15"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        value: "v21.0"
      - key: WHATSAPP_MODE
        value: "template"
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANG
        value: "en"
      - key: WHATSAPP_TIMEOUT_SECONDS
        value: "15"
      - key: MESSAGING_DRY_RUN
        value: "false"
      - key: MESSAGING_MAX_RECIPIENTS
        value: "20"
      - key: MESSAGING_MAX_PER_HOUR
        value: "60"
