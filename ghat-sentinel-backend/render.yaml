services:
  - type: web
    name: ghat-sentinel-backend
    runtime: python
    plan: starter            # persistent disks require a paid plan
    buildCommand: pip install -r requirements.txt
    startCommand: (python scripts/download_data.py || echo "download failed; continuing"); (python scripts/seed_database.py || echo "seed failed; continuing"); uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    disk:
      name: ghat-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////var/data/ghat_sentinel.db
      - key: DATA_DIR
        value: /var/data
      - key: FRONTEND_ORIGIN
        value: https://your-frontend.example.com   # change me
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
